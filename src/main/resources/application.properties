spring.datasource.url=jdbc:postgresql://postgres:5432/kart_db
spring.datasource.username=postgres
spring.datasource.password=root

# Hibernate НЕ должен создавать таблицы, это делает Flyway
spring.jpa.hibernate.ddl-auto=validate

# Настройки Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Если база пустая, Flyway должен создать свою таблицу истории
spring.flyway.baseline-on-migrate=true

# Значения по умолчанию для локального запуска
karting.track.slug=narvskaya
karting.base-url=https://timing.batyrshin.name/tracks
karting.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36

# Live-тайминг: постоянное подключение к WebSocket сайта.
# Сессия считается завершённой, если данных нет дольше stale-seconds.
karting.live.enabled=true
karting.live.ws-url=wss://timing.batyrshin.name/ws
karting.live.origin=https://timing.batyrshin.name
karting.live.stale-seconds=180

# ------------------------------------------------------------------
# Фоновый опрос сайта. Заезды идут примерно с 09:45 до 22:00, поэтому
# ночью нет смысла опрашивать сайт так же часто, как днём.
# Время — локальное для JVM; в Docker задаётся через KARTING_TZ.
# ------------------------------------------------------------------
karting.polling.day-interval=60s
karting.polling.night-interval=10m
karting.polling.night-start=23:00
karting.polling.night-end=08:00
karting.polling.day-prefetch-limit=0
karting.polling.night-prefetch-limit=0
karting.polling.night-reconnect-delay=10m
# Проверка новых заездов: шедулер смотрит верхушку списка и синхронизирует
# только те заезды, которых ещё нет в БД. Старые заезды подтягиваются при
# открытии, live-заезд обновляется отдельным сервисом после финиша.
karting.polling.new-heats-sync-enabled=true
# Не больше N новых заездов за один проход, чтобы не упираться в лимит сайта.
karting.polling.new-heats-per-run=3

# ------------------------------------------------------------------
# Защита внешнего сайта тайминга от слишком частых запросов.
# Все исходящие HTTP-запросы (список, страницы заездов, прогрев, шедулер)
# проходят через единый ограничитель.
# ------------------------------------------------------------------
# Минимальный интервал между любыми запросами к сайту.
karting.site.min-request-interval-ms=2500
# Базовая пауза при 429/403/5xx; при повторах растёт экспоненциально.
karting.site.base-cooldown-ms=60000
# Максимальная пауза, чтобы не «залипнуть» навсегда.
karting.site.max-cooldown-ms=600000
# Сколько секунд отдавать разобранный список из памяти без обращения к сайту.
karting.list.cache-ttl-ms=120000

# ------------------------------------------------------------------
# Метрики (Micrometer -> Prometheus). Отдаём на отдельном порту, чтобы
# /actuator не был доступен снаружи вместе с публичным API на 8080.
# ------------------------------------------------------------------
management.server.port=8081
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.endpoint.metrics.enabled=true
management.metrics.tags.application=karting-backend
# Гистограмма для http.server.requests: нужна для p95/p99 в Grafana.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=10ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
# Пул соединений и JVM-метрики включены автоматически (HikariCP, JVM).
