services:
  postgres:
    image: postgres:15-alpine
    container_name: karting_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - karting_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: karting_backend
    ports:
      - "8080:8080"
    environment:
      # Передаем настройки БД в Spring Boot
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      # Передаем бизнес-настройки в Spring Boot
      KARTING_TRACK_SLUG: ${KARTING_TRACK_SLUG}
      KARTING_BASE_URL: ${KARTING_BASE_URL}
      KARTING_USER_AGENT: ${KARTING_USER_AGENT}

      # Live-тайминг (значения по умолчанию можно не задавать в .env)
      KARTING_LIVE_ENABLED: ${KARTING_LIVE_ENABLED:-true}
      KARTING_LIVE_WS_URL: ${KARTING_LIVE_WS_URL:-wss://timing.batyrshin.name/ws}
      KARTING_LIVE_ORIGIN: ${KARTING_LIVE_ORIGIN:-https://timing.batyrshin.name}
      KARTING_LIVE_STALE_SECONDS: ${KARTING_LIVE_STALE_SECONDS:-180}

      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  karting_postgres_data:
    driver: local