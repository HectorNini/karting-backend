spring.datasource.url=jdbc:postgresql://postgres:5432/kart_db
spring.datasource.username=postgres
spring.datasource.password=root

# Hibernate НЕ должен создавать таблицы, это делает Flyway
spring.jpa.hibernate.ddl-auto=validate

# Настройки Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Если база пустая, Flyway должен создать свою таблицу истории
spring.flyway.baseline-on-migrate=true

# Значения по умолчанию для локального запуска
karting.track.slug=narvskaya
karting.base-url=https://timing.batyrshin.name/tracks
karting.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36