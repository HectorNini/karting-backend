services:
  postgres:
    image: postgres:15-alpine
    container_name: karting_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - karting_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: karting_backend
    ports:
      - "8080:8080"
      # Actuator/Prometheus — только для локальной отладки, не наружу.
      - "127.0.0.1:8081:8081"
    environment:
      # Передаем настройки БД в Spring Boot
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      # Передаем бизнес-настройки в Spring Boot
      KARTING_TRACK_SLUG: ${KARTING_TRACK_SLUG}
      KARTING_BASE_URL: ${KARTING_BASE_URL}
      KARTING_USER_AGENT: ${KARTING_USER_AGENT}

      # Live-тайминг (значения по умолчанию можно не задавать в .env)
      KARTING_LIVE_ENABLED: ${KARTING_LIVE_ENABLED:-true}
      KARTING_LIVE_WS_URL: ${KARTING_LIVE_WS_URL:-wss://timing.batyrshin.name/ws}
      KARTING_LIVE_ORIGIN: ${KARTING_LIVE_ORIGIN:-https://timing.batyrshin.name}
      KARTING_LIVE_STALE_SECONDS: ${KARTING_LIVE_STALE_SECONDS:-180}

      # Часовой пояс: время в расписании опроса и last_updated считаются в нём.
      TZ: ${KARTING_TZ:-Europe/Moscow}
      JAVA_TOOL_OPTIONS: -Duser.timezone=${KARTING_TZ:-Europe/Moscow}

      # Ночной режим опроса сайта (заездов ночью нет).
      KARTING_POLLING_DAY_INTERVAL: ${KARTING_POLLING_DAY_INTERVAL:-30s}
      KARTING_POLLING_NIGHT_INTERVAL: ${KARTING_POLLING_NIGHT_INTERVAL:-10m}
      KARTING_POLLING_NIGHT_START: ${KARTING_POLLING_NIGHT_START:-23:00}
      KARTING_POLLING_NIGHT_END: ${KARTING_POLLING_NIGHT_END:-08:00}
      KARTING_POLLING_DAY_PREFETCH_LIMIT: ${KARTING_POLLING_DAY_PREFETCH_LIMIT:-30}
      KARTING_POLLING_NIGHT_PREFETCH_LIMIT: ${KARTING_POLLING_NIGHT_PREFETCH_LIMIT:-5}
      KARTING_POLLING_NIGHT_RECONNECT_DELAY: ${KARTING_POLLING_NIGHT_RECONNECT_DELAY:-10m}

      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------
  # Наблюдаемость: включается отдельно, чтобы обычный `docker compose up`
  # не тянул 400-500 МБ лишних контейнеров.
  #   docker compose --profile observability up -d
  # ----------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: karting_prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - karting_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.3.0
    container_name: karting_grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/karting-load.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - karting_grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: karting_node_exporter
    profiles: ["observability"]
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: karting_postgres_exporter
    profiles: ["observability"]
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  karting_postgres_data:
    driver: local
  karting_prometheus_data:
    driver: local
  karting_grafana_data:
    driver: local